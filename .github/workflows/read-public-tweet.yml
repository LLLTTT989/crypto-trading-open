name: Read public tweet

on:
  pull_request:
    paths:
      - ".github/workflows/read-public-tweet.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch tweet images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tweet-media
          curl -fL --retry 2 'https://pbs.twimg.com/media/HPK9RtBaYAEqtjI.jpg?name=orig' -o tweet-media/image-1.jpg
          curl -fL --retry 2 'https://pbs.twimg.com/media/HPK9TQjaQAAjEJY.jpg?name=orig' -o tweet-media/image-2.jpg
          file tweet-media/*
          ls -lh tweet-media
      - name: Upload tweet images
        uses: actions/upload-artifact@v4
        with:
          name: tweet-media-2085938658897781117
          path: tweet-media/
          retention-days: 1
