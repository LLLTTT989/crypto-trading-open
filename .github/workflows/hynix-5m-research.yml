name: Hynix 5m Research

on:
  pull_request:
    branches: [main]
    paths:
      - 'hynix_research/**'
      - '.github/workflows/hynix-5m-research.yml'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild analysis script
        run: |
          cat hynix_research/v2_chunks/part_*.b64 | base64 -d | gzip -d > hynix_research/hynix_research_v2.py
          python -m py_compile hynix_research/hynix_research_v2.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests numpy pandas matplotlib statsmodels

      - name: Download, analyze, and backtest
        env:
          MPLBACKEND: Agg
        run: python hynix_research/hynix_research_v2.py --output-dir hynix_5m_report

      - name: Package report
        run: zip -r hynix_5m_report.zip hynix_5m_report

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: hynix-5m-report
          path: |
            hynix_5m_report.zip
            hynix_5m_report/
          retention-days: 7
          if-no-files-found: error
