name: Hynix full 5m research

on:
  pull_request:
    branches:
      - main
    paths:
      - 'hynix_research/**'
      - '.github/workflows/hynix-5m-research.yml'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Reconstruct and verify Data Vision analysis script
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hynix_research/runtime
          cat hynix_research/archive/part_*.b64 | tr -d '\n\r ' | base64 --decode > /tmp/hynix_full_research.py.gz
          echo 'dcbfdd3647237c1cb0e0d315be7b48f1fca6e7ea6dda8ec9eaf75e4a31420581  /tmp/hynix_full_research.py.gz' | sha256sum -c -
          gzip -t /tmp/hynix_full_research.py.gz
          gzip -dc /tmp/hynix_full_research.py.gz > hynix_research/runtime/hynix_full_research.py
          echo '5b6b5cddea335aae055402dc33deec099c05e799b085d17467f76c6e1fb99224  hynix_research/runtime/hynix_full_research.py' | sha256sum -c -
          python -m py_compile hynix_research/runtime/hynix_full_research.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests numpy pandas scipy statsmodels matplotlib pyarrow

      - name: Fetch official archives and run full research
        env:
          MPLBACKEND: Agg
        run: |
          python hynix_research/runtime/hynix_full_research.py --output-dir output/hynix_5m_report

      - name: Package outputs
        run: |
          cd output
          zip -r hynix_binance_full_5m_report.zip hynix_5m_report
          sha256sum hynix_binance_full_5m_report.zip > hynix_binance_full_5m_report.zip.sha256

      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: hynix-binance-full-5m-report
          path: |
            output/hynix_binance_full_5m_report.zip
            output/hynix_binance_full_5m_report.zip.sha256
          if-no-files-found: error
          retention-days: 7
