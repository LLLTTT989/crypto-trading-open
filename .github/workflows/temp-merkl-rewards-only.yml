name: 临时只查 Merkl 奖励

on:
  pull_request:
    paths:
      - ".github/workflows/temp-merkl-rewards-only.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Merkl rewards and explorer history
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests
          python3 - <<'PY'
          import requests, json
          from decimal import Decimal, getcontext
          getcontext().prec=80
          A='0xe01ecff2f6c4f2416e83e6861e8abf79b1c95950'
          urls={
            'merkl':f'https://api.merkl.xyz/v4/users/{A}/rewards?chainId=1&reloadChainId=1',
            'transactions':f'https://eth.blockscout.com/api/v2/addresses/{A}/transactions',
            'token_transfers':f'https://eth.blockscout.com/api/v2/addresses/{A}/token-transfers?type=ERC-20',
          }
          data={}
          for k,u in urls.items():
            r=requests.get(u,timeout=60,headers={'user-agent':'Mozilla/5.0','accept':'application/json'})
            print('HTTP',k,r.status_code,u)
            if not r.ok:
              print('HTTP_BODY',k,r.text[:2000])
              data[k]={}
              continue
            data[k]=r.json()
          if not isinstance(data.get('merkl'),list):
            # Retry without forced cache refresh for compatibility.
            u=f'https://api.merkl.xyz/v4/users/{A}/rewards?chainId=1'
            r=requests.get(u,timeout=60,headers={'user-agent':'Mozilla/5.0','accept':'application/json'})
            print('HTTP merkl_retry',r.status_code,u)
            r.raise_for_status(); data['merkl']=r.json()
          rewards=[]
          for row in data['merkl']:
            for x in row.get('rewards',[]):
              t=x.get('token',{}); d=int(t.get('decimals',18)); s=Decimal(10)**d
              amount=Decimal(str(x.get('amount',0))); claimed=Decimal(str(x.get('claimed',0))); pending=Decimal(str(x.get('pending',0)))
              rewards.append({'symbol':t.get('symbol'),'address':t.get('address'),'decimals':d,'credited':str(amount/s),'claimed':str(claimed/s),'claimable':str((amount-claimed)/s),'pending':str(pending/s),'total_including_pending':str((amount+pending)/s),'price':t.get('price'),'breakdowns':x.get('breakdowns',[])})
          print('MERKL_ONLY_BEGIN')
          print(json.dumps({'rewards':rewards,'recent_transactions':(data.get('transactions') or {}).get('items',[])[:30],'recent_token_transfers':(data.get('token_transfers') or {}).get('items',[])[:60]},ensure_ascii=False,indent=2,default=str))
          print('MERKL_ONLY_END')
          PY
