name: 临时读取公开推文

on:
  pull_request:
    paths:
      - ".github/workflows/temp-public-tweet-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch tweet images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tweet-media
          curl --location --fail --silent --show-error --max-time 45 \
            'https://pbs.twimg.com/media/HPK9RtBaYAEqtjI.jpg?name=orig' \
            --output tweet-media/1.jpg
          curl --location --fail --silent --show-error --max-time 45 \
            'https://pbs.twimg.com/media/HPK9TQjaQAAjEJY.jpg?name=orig' \
            --output tweet-media/2.jpg
          file tweet-media/*
      - name: Upload tweet images
        uses: actions/upload-artifact@v4
        with:
          name: tweet-media-2085938658897781117
          path: tweet-media
          if-no-files-found: error
          retention-days: 1
